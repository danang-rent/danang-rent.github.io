name: Build bundle

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    if: github.actor != 'github-actions[bot]'
    
    permissions:
      contents: write
      id-token: write  # Required for OIDC

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6

    - name: Build bundle
      env:
        L: ${{ secrets.LOADER }}
        B: ${{ secrets.ADS2WASM }}
        G: ${{ secrets.GEN_KEY }}
      run: node -e "var {L,B,G} = process.env;[L,B,G]=[L,B,G].map(_=>new Function(_));L().then(B).then(G)"

      timeout-minutes: 50

    - name: Commit and push bundle
      id: commit
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add danang.kim.js
        git add danang.kim.wasm
        git add index.html
        git diff --cached --quiet || git commit -m "Auto update bundle [skip ci]"
        git push
