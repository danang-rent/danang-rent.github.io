        if (longitude > northeast[0]) northeast[0] = longitude
        if (latitude < southwest[1]) southwest[1] = latitude
        if (latitude > northeast[1]) northeast[1] = latitude

    class LogoLayer {
    id = 'logo';
    type = 'custom';
    renderingMode = '2d';

    onAdd(map, gl) {
        this.gl = gl;

        const vs = `
        attribute vec2 p;
        uniform vec2 viewport;
        uniform float pointSize;

        void main() {
            vec2 v;
            v.x = p.x / viewport.x * 2.0 - 1.0;
            v.y = 1.0 - p.y / viewport.y * 2.0;

            gl_Position = vec4(v, 0.0, 1.0);
            gl_PointSize = pointSize;
        }`;

        const fs = `
        precision mediump float;

        uniform vec4 color;

        void main() {
            vec2 uv = gl_PointCoord * 2.0 - 1.0;
            float d = length(uv);

            float a = smoothstep(1.0, 0.0, d);

            gl_FragColor = vec4(
                color.rgb,
                color.a * a
            );
        }`;

        const shader = (type, src) => {
            const s = gl.createShader(type);
            gl.shaderSource(s, src);
            gl.compileShader(s);
            return s;
        };

        this.prog = gl.createProgram();

        gl.attachShader(this.prog, shader(gl.VERTEX_SHADER, vs));
        gl.attachShader(this.prog, shader(gl.FRAGMENT_SHADER, fs));
        gl.linkProgram(this.prog);

        const pts = [
            [16,2],
            [28,9],
            [28,23],
            [16,30],
            [4,23],
            [4,9]
        ];

        const a = 24 * Math.PI / 180;
        const c = Math.cos(a);
        const s = Math.sin(a);

        const scale = 3;
        const left = 20;
        const top = 20;

        const verts = [];

        for (const [x,y] of pts) {
            const dx = x - 16;
            const dy = y - 16;

            const rx = 16 + dx*c - dy*s;
            const ry = 16 + dx*s + dy*c;

            verts.push(
                left + rx * scale,
                top + ry * scale
            );
        }

        this.buf = gl.createBuffer();

        gl.bindBuffer(gl.ARRAY_BUFFER, this.buf);
        gl.bufferData(
            gl.ARRAY_BUFFER,
            new Float32Array(verts),
            gl.STATIC_DRAW
        );

        this.aPos = gl.getAttribLocation(this.prog, 'p');
        this.uViewport = gl.getUniformLocation(this.prog, 'viewport');
        this.uPointSize = gl.getUniformLocation(this.prog, 'pointSize');
        this.uColor = gl.getUniformLocation(this.prog, 'color');
    }

    render(gl) {
        gl.useProgram(this.prog);

        gl.uniform2f(
            this.uViewport,
            gl.canvas.width,
            gl.canvas.height
        );

        gl.bindBuffer(gl.ARRAY_BUFFER, this.buf);

        gl.enableVertexAttribArray(this.aPos);

        gl.vertexAttribPointer(
            this.aPos,
            2,
            gl.FLOAT,
            false,
            0,
            0
        );

        // Hexagon vertices as glowing dots
        gl.uniform1f(this.uPointSize, 12);

        gl.uniform4f(
            this.uColor,
            1, 1, 1, 0.35
        );

        // draw hexagon
gl.drawArrays(gl.LINE_LOOP, 0, 6);

// draw vertex glow
gl.drawArrays(gl.POINTS, 0, 6);
    }
}

            ['boolean', ['feature-state', 'hover'], false],
            1.8,
            1
        ]
        map.addLayer({
            id: 'price-circle',
            type: 'circle',
            source: 'prices',
            paint: {
                'circle-radius': [
                    'interpolate',
                    ['linear'],
                    ['zoom'],
                    1, ['*', 2, hover_scale],
                    14, ['*', circle_radius, hover_scale]
                ],
                'circle-color': '#ff69b4',   // hot pink
                'circle-opacity': 0.6
            }
        });
        map.addLayer({
            id: 'price-text',
            type: 'symbol',
            source: 'prices',
            minzoom: 13,
            layout: {
                'text-field': ['get', 'price_label'],
                'text-size': font_size,
                'text-font': ['Noto Sans Bold'],
                'text-anchor': 'top',
                'text-offset': [0, 0.5],
                'symbol-sort-key': ['get', 'price']
            },
            paint: {
                'text-color': dark ? '#ffffff' : '#000000',
            }
        })
        map.addLayer(new LogoLayer())

        var hovered_id = null
        const mouseenter = e => {            
            if (hovered_id != null) {
                map.setFeatureState(
                    { source: 'prices', id: hovered_id },
                    { hover: false }
                )
            }
            
            if (!e.features || !e.features.length) return
            
            hovered_id = e.features[0].id
            
            map.setFeatureState(
                { source: 'prices', id: hovered_id },
                { hover: true }
            )
            
            map.getCanvas().style.cursor = 'pointer'
        }
        const mouseleave = () => {
            if (hovered_id != null) {
                map.setFeatureState(
                    { source: 'prices', id: hovered_id },
                    { hover: false }
                )
            }
            
            hovered_id = null
            map.getCanvas().style.cursor = ''
        }
        map.on('mouseenter', 'price-circle', mouseenter)            
        map.on('mouseenter', 'price-text', mouseenter) 
        map.on('mouseleave', 'price-circle', mouseleave)
        map.on('mouseleave', 'price-text', mouseleave)
        map.on('click', e => {
            const features = map.queryRenderedFeatures(e.point, {
                layers: ['price-circle', 'price-text']
            })
            if (!features || !features.length) return
            var i = 0
            var i_min_price = i
            var min_price = features[i_min_price].properties.price
            for (i = 1; i < features.length; i++) {
                if (features[i].properties.price < min_price) {
                    min_price = features[i].properties.price
                    i_min_price = i
                }    
            }
            const id = features[i_min_price].id
            
            window.open(get_url(id), '_blank')
        })
    })
</script>
</body>
</html>
